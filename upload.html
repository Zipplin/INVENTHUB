<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Invention - InventHub</title>
    <!-- Link your main CSS -->
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body>

<div class="upload-container">
    <h1 class="upload-heading">💡 Upload Your Invention</h1>
    <p class="upload-subheading">Fill in the details to showcase your work to the community.</p>

    <form class="upload-form" action="/upload" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="title">Invention Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-grid form-grid-3">
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" required>
            </div>
            <div class="form-group">
                <label for="industry">Industry</label>
                <input type="text" id="industry" name="industry" required>
            </div>
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" required>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6" required></textarea>
        </div>

        <div class="form-grid form-grid-2">
            <div class="form-group">
                <label for="stage">Development Stage</label>
                <select id="stage" name="stage">
                    <option>Idea</option>
                    <option>Prototype</option>
                    <option>Working Prototype</option>
                    <option>Tested</option>
                    <option>Ready for Manufacturing</option>
                    <option>Patented</option>
                </select>
            </div>
            <div class="form-group">
                <label for="lookingFor">Looking For</label>
                <select id="lookingFor" name="lookingFor">
                    <option>Investor</option>
                    <option>Company</option>
                    <option>University</option>
                </select>
            </div>
        </div>

        <div class="form-group file-upload-group">
            <label for="image">Invention Image</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary upload-btn">
            🚀 Publish Invention
        </button>

    </form>
</div>

</body>
</html>
